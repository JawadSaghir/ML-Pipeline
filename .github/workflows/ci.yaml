name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv installs the Python version pinned in .python-version and the exact,
      # cross-platform dependency set recorded in uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Runs unit tests plus an end-to-end pipeline run on synthetic data,
      # so CI never depends on Yahoo Finance being reachable.
      - name: Run tests
        run: uv run pytest test -v
