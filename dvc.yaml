stages:
  ingestion:
    cmd: python src/data/ingestion.py
    deps:
      - src/data/ingestion.py
    outs:
      - data/AAPL_data.csv

  feature_engineering:
    cmd: python src/data/feature_engineering.py
    deps:
      - src/data/feature_engineering.py
      - src/data/ingestion.py
      - data/AAPL_data.csv
    outs:
      - data/processed/AAPL_features.csv

  preprocessing:
    cmd: python src/data/preprocessing.py
    deps:
      - src/data/preprocessing.py
      - data/processed/AAPL_features.csv
    params:
      - configs/params.yaml:
          - data_path
          - test_size
          - features
          - label
          - splits
    outs:
      - data/processed/X_train.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_test.csv

  model_building:
    cmd: python src/models/model_building.py
    deps:
      - src/models/model_building.py
      - data/processed/X_train.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_test.csv
    params:
      - configs/params.yaml:
          - splits
          - model_params
          - model_save_path
    outs:
      - models_artifacts/random_forest.pkl
